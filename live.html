<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4track Live - Real-Time Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-blue: #0A1C4F;
            --accent-yellow: #FFD700;
        }
        body {
            background-color: var(--primary-blue);
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        .live-header {
            background-color: white;
            border-bottom: 2px solid var(--accent-yellow);
            padding: 10px 20px;
        }
        .navbar-brand {
            color: #000 !important;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .live-container {
            height: calc(100vh - 85px);
            padding: 15px;
        }
        .view-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--accent-yellow);
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #twitch-player {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }
        .view-label {
            background: var(--accent-yellow);
            color: var(--primary-blue);
            padding: 2px 15px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            width: fit-content;
            z-index: 10;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 768px) {
            .live-container { height: auto; }
            .view-box { height: 450px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <nav class="live-header d-flex justify-content-between align-items-center sticky-top">
        <a class="navbar-brand" href="#">
            <i class="bi bi-broadcast-pin me-2 text-danger"></i>
            4TRACK LIVE
        </a>
        <div class="d-flex align-items-center">
            <span class="badge bg-danger me-3"><i class="bi bi-circle-fill small me-1"></i> LIVE</span>
            <a href="wconvert.html" class="btn btn-sm btn-dark fw-bold">SUPPORT</a>
        </div>
    </nav>

    <div class="container-fluid live-container">
        <div class="row h-100 g-3">
            <div class="col-12 col-md-6 h-100">
                <div class="view-box">
                    <div class="view-label">Live Stream</div>
                    <div id="twitch-player"></div>
                    
                    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
                    
                    <script type="text/javascript">
                      var options = {
                        width: "100%",
                        height: "100%",
                        channel: "4trackgps",
                        // Ensure your domain is listed here correctly
                        parent: ["4track.co.za", "www.4track.co.za"]
                      };
                      // Correct constructor for interactive video player
                      var player = new Twitch.Player("twitch-player", options);
                      player.setVolume(0.5);
                    </script>
                </div>
            </div>

            <div class="col-12 col-md-6 h-100">
                <div class="view-box">
                    <div class="view-label">Live Map view</div>
                    <iframe src="https://demo.4track.co.za/?token=SDBGAiEAhqdpsNPjesaTPDJpfyCPA6ZlFyrfQlVpmVeQTBbPMwICIQC4WUacThAAFyP6q67MFraD0XFzCJeu7mZ9aZWpKnYMcnsidSI6MiwiZSI6IjIwMjctMDMtMzBUMDA6MDA6MDAuMDAwKzAwOjAwIn0"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
